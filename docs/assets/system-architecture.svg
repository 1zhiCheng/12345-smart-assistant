<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">芜湖12345智慧政务Agent系统架构</title>
  <desc id="desc">展示市民、营业员、部门管理员和系统管理员通过Next.js前端进入FastAPI治理层，经固定Agent工作流完成语音受理、工单生成、部门路由、混合检索、回复审核和反馈进化，并由MongoDB、Redis Stream、本地BGE与监控部署体系支撑。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef4f3"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="0.55" stop-color="#123b36"/>
      <stop offset="1" stop-color="#8f171b"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="0.48" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#fee2e2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b91c1c"/>
    </marker>
    <style>
      .title{font:700 34px "Microsoft YaHei","PingFang SC",sans-serif;fill:#fff;letter-spacing:1px}
      .subtitle{font:400 16px "Microsoft YaHei","PingFang SC",sans-serif;fill:#dbeafe}
      .layer{font:700 18px "Microsoft YaHei","PingFang SC",sans-serif;fill:#0f172a}
      .layer-en{font:600 11px Arial,sans-serif;fill:#64748b;letter-spacing:1.5px}
      .node{font:700 16px "Microsoft YaHei","PingFang SC",sans-serif;fill:#0f172a}
      .small{font:400 12px "Microsoft YaHei","PingFang SC",sans-serif;fill:#475569}
      .tiny{font:400 11px "Microsoft YaHei","PingFang SC",sans-serif;fill:#64748b}
      .white{fill:#fff}.mutedWhite{fill:#cbd5e1}
      .pill{font:600 11px "Microsoft YaHei","PingFang SC",sans-serif;fill:#334155}
      .metric{font:700 13px "Microsoft YaHei","PingFang SC",sans-serif;fill:#166534}
      .edge{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .edge-red{stroke:#b91c1c;stroke-width:2.2;fill:none;marker-end:url(#arrowRed)}
      .edge-dash{stroke:#94a3b8;stroke-width:1.8;stroke-dasharray:6 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="1040" rx="28" fill="url(#bg)"/>
  <rect x="30" y="28" width="1540" height="102" rx="22" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="70" y="75" class="title">芜湖 12345 智慧政务 Agent</text>
  <text x="70" y="105" class="subtitle">语音诉求 → 可信工单 → 智能转派 → 政策检索 → 人工终审 · 全链路可追溯</text>
  <g transform="translate(1235 51)">
    <rect width="292" height="54" rx="15" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="22" y="23" class="white" style="font:700 13px 'Microsoft YaHei',sans-serif">TRUSTED GOVERNMENT AI</text>
    <text x="22" y="42" class="mutedWhite" style="font:400 11px 'Microsoft YaHei',sans-serif">规则守底 · 模型增效 · 人工负责</text>
  </g>

  <!-- Layer 1 -->
  <g transform="translate(30 154)">
    <rect width="1540" height="128" rx="20" fill="#ffffff" stroke="#dbe3e8" filter="url(#shadow)"/>
    <text x="28" y="34" class="layer">多角色业务入口</text><text x="28" y="54" class="layer-en">MULTI-ROLE EXPERIENCE</text>
    <g transform="translate(250 20)">
      <g><rect width="270" height="88" rx="16" fill="#fff7ed" stroke="#fed7aa"/><circle cx="36" cy="44" r="20" fill="#f97316"/><text x="36" y="50" text-anchor="middle" class="white" style="font:700 18px sans-serif">民</text><text x="70" y="37" class="node">市民自助咨询</text><text x="70" y="59" class="small">文字 / 语音问答 · 无法解决则转工单</text></g>
      <g transform="translate(288 0)"><rect width="270" height="88" rx="16" fill="#fef2f2" stroke="#fecaca"/><circle cx="36" cy="44" r="20" fill="#b91c1c"/><text x="36" y="50" text-anchor="middle" class="white" style="font:700 18px sans-serif">受</text><text x="70" y="37" class="node">营业员受理工作台</text><text x="70" y="59" class="small">录音校对 · 要素确认 · 工单提交</text></g>
      <g transform="translate(576 0)"><rect width="270" height="88" rx="16" fill="#ecfdf5" stroke="#a7f3d0"/><circle cx="36" cy="44" r="20" fill="#047857"/><text x="36" y="50" text-anchor="middle" class="white" style="font:700 18px sans-serif">办</text><text x="70" y="37" class="node">部门管理员办理台</text><text x="70" y="59" class="small">领取处置 · 政策依据 · 审核办结</text></g>
      <g transform="translate(864 0)"><rect width="270" height="88" rx="16" fill="#eff6ff" stroke="#bfdbfe"/><circle cx="36" cy="44" r="20" fill="#1d4ed8"/><text x="36" y="50" text-anchor="middle" class="white" style="font:700 18px sans-serif">管</text><text x="70" y="37" class="node">系统管理员治理台</text><text x="70" y="59" class="small">知识库 · Trace · Loop · 运行监控</text></g>
    </g>
  </g>

  <path d="M800 282 L800 314" class="edge"/>

  <!-- Layer 2 -->
  <g transform="translate(30 316)">
    <rect width="1540" height="105" rx="20" fill="#ffffff" stroke="#dbe3e8" filter="url(#shadow)"/>
    <text x="28" y="34" class="layer">接入与确定性治理层</text><text x="28" y="54" class="layer-en">NEXT.JS + FASTAPI CONTROL PLANE</text>
    <g transform="translate(330 19)">
      <rect width="248" height="66" rx="15" fill="#172554"/><text x="124" y="29" text-anchor="middle" class="white" style="font:700 16px 'Microsoft YaHei',sans-serif">Next.js 15 / React 19</text><text x="124" y="49" text-anchor="middle" class="mutedWhite" style="font:400 11px 'Microsoft YaHei',sans-serif">响应式门户 · RBAC界面 · 音频播放器</text>
      <path d="M250 33 L315 33" class="edge"/>
      <rect x="318" width="520" height="66" rx="15" fill="#123b36"/><text x="578" y="28" text-anchor="middle" class="white" style="font:700 16px 'Microsoft YaHei',sans-serif">FastAPI 治理控制平面</text><text x="578" y="49" text-anchor="middle" class="mutedWhite" style="font:400 11px 'Microsoft YaHei',sans-serif">鉴权 · 部门隔离 · 状态机 · 超时降级 · 审计 Trace · 发布门禁</text>
      <path d="M840 33 L905 33" class="edge"/>
      <rect x="908" width="248" height="66" rx="15" fill="#7f1d1d"/><text x="1032" y="28" text-anchor="middle" class="white" style="font:700 16px 'Microsoft YaHei',sans-serif">人工责任边界</text><text x="1032" y="49" text-anchor="middle" class="mutedWhite" style="font:400 11px 'Microsoft YaHei',sans-serif">草稿确认 · 部门审核 · 禁止自动发布</text>
    </g>
  </g>

  <path d="M800 421 L800 451" class="edge"/>

  <!-- Layer 3 DAG -->
  <g transform="translate(30 454)">
    <rect width="1540" height="210" rx="20" fill="#ffffff" stroke="#dbe3e8" filter="url(#shadow)"/>
    <text x="28" y="34" class="layer">Agent Harness 固定 DAG</text><text x="28" y="54" class="layer-en">CONTROLLED REASONING WORKFLOW</text>
    <rect x="250" y="68" width="1240" height="104" rx="18" fill="url(#flow)" stroke="#cbd5e1"/>
    <g transform="translate(278 84)">
      <g><circle cx="42" cy="42" r="37" fill="#1e3a8a"/><text x="42" y="38" text-anchor="middle" class="white" style="font:700 13px sans-serif">ASR</text><text x="42" y="55" text-anchor="middle" class="mutedWhite" style="font:400 9px sans-serif">角色识别</text></g>
      <path d="M84 42 L132 42" class="edge"/>
      <g transform="translate(142 0)"><circle cx="42" cy="42" r="37" fill="#9f1239"/><text x="42" y="38" text-anchor="middle" class="white" style="font:700 12px sans-serif">INTAKE</text><text x="42" y="55" text-anchor="middle" class="mutedWhite" style="font:400 9px sans-serif">工单结构化</text></g>
      <path d="M226 42 L274 42" class="edge"/>
      <g transform="translate(284 0)"><circle cx="42" cy="42" r="37" fill="#6d28d9"/><text x="42" y="38" text-anchor="middle" class="white" style="font:700 12px sans-serif">INTENT</text><text x="42" y="55" text-anchor="middle" class="mutedWhite" style="font:400 9px sans-serif">分类路由</text></g>
      <path d="M368 42 L416 42" class="edge"/>
      <g transform="translate(426 0)"><circle cx="42" cy="42" r="37" fill="#0369a1"/><text x="42" y="38" text-anchor="middle" class="white" style="font:700 11px sans-serif">REWRITE</text><text x="42" y="55" text-anchor="middle" class="mutedWhite" style="font:400 9px sans-serif">查询改写</text></g>
      <path d="M510 42 L558 42" class="edge"/>
      <g transform="translate(568 0)"><circle cx="42" cy="42" r="37" fill="#047857"/><text x="42" y="38" text-anchor="middle" class="white" style="font:700 11px sans-serif">RETRIEVE</text><text x="42" y="55" text-anchor="middle" class="mutedWhite" style="font:400 9px sans-serif">混合检索</text></g>
      <path d="M652 42 L700 42" class="edge"/>
      <g transform="translate(710 0)"><circle cx="42" cy="42" r="37" fill="#b45309"/><text x="42" y="38" text-anchor="middle" class="white" style="font:700 11px sans-serif">ANSWER</text><text x="42" y="55" text-anchor="middle" class="mutedWhite" style="font:400 9px sans-serif">有据回复</text></g>
      <path d="M794 42 L842 42" class="edge"/>
      <g transform="translate(852 0)"><circle cx="42" cy="42" r="37" fill="#be123c"/><text x="42" y="38" text-anchor="middle" class="white" style="font:700 11px sans-serif">VERIFY</text><text x="42" y="55" text-anchor="middle" class="mutedWhite" style="font:400 9px sans-serif">合规校验</text></g>
      <path d="M936 42 L984 42" class="edge-red"/>
      <g transform="translate(994 0)"><circle cx="42" cy="42" r="37" fill="#7f1d1d"/><text x="42" y="37" text-anchor="middle" class="white" style="font:700 10px sans-serif">HANDOFF</text><text x="42" y="54" text-anchor="middle" class="mutedWhite" style="font:400 9px sans-serif">人工终审</text></g>
    </g>
    <g transform="translate(250 184)">
      <rect width="191" height="22" rx="11" fill="#e0e7ff"/><text x="95" y="15" text-anchor="middle" class="pill">LLM JSON异常 → 规则降级</text>
      <rect x="205" width="220" height="22" rx="11" fill="#dcfce7"/><text x="315" y="15" text-anchor="middle" class="pill">部门Top-K + 可解释路由原因</text>
      <rect x="439" width="225" height="22" rx="11" fill="#fef3c7"/><text x="552" y="15" text-anchor="middle" class="pill">官方Chunk引用 + 数字事实核验</text>
      <rect x="678" width="228" height="22" rx="11" fill="#fee2e2"/><text x="792" y="15" text-anchor="middle" class="pill">隐私 / 越权承诺 / 自动发布门禁</text>
      <rect x="920" width="220" height="22" rx="11" fill="#f1f5f9"/><text x="1030" y="15" text-anchor="middle" class="pill">全链路Trace + 状态可回放</text>
    </g>
  </g>

  <path d="M800 664 L800 694" class="edge"/>

  <!-- Layer 4 -->
  <g transform="translate(30 697)">
    <rect width="1540" height="184" rx="20" fill="#ffffff" stroke="#dbe3e8" filter="url(#shadow)"/>
    <text x="28" y="34" class="layer">可信知识、记忆与反馈进化</text><text x="28" y="54" class="layer-en">FACT PLANE + MEMORY + GOVERNED LOOP</text>
    <g transform="translate(250 67)">
      <g><rect width="350" height="92" rx="16" fill="#ecfdf5" stroke="#86efac"/><text x="22" y="28" class="node">可信 RAG 事实平面</text><text x="22" y="50" class="small">264份芜湖官方文档 · 1,891条运行Chunk</text><text x="22" y="72" class="small">BM25 + BGE 512维 + RRF · 原文引用</text><text x="310" y="54" text-anchor="middle" style="font:700 28px sans-serif;fill:#15803d">RAG</text></g>
      <g transform="translate(372 0)"><rect width="350" height="92" rx="16" fill="#eff6ff" stroke="#93c5fd"/><text x="22" y="28" class="node">五类治理记忆</text><text x="22" y="50" class="small">工作 / 情景 / 用户 / 组织 / 程序性记忆</text><text x="22" y="72" class="small">事实优先 · Consent · TTL · 来源绑定</text><text x="310" y="54" text-anchor="middle" style="font:700 26px sans-serif;fill:#1d4ed8">MEM</text></g>
      <g transform="translate(744 0)"><rect width="398" height="92" rx="16" fill="#fff7ed" stroke="#fdba74"/><text x="22" y="28" class="node">受治理的反馈 Loop</text><text x="22" y="50" class="small">Execute → Observe → Reflect → Adapt → Deploy</text><text x="22" y="72" class="small">Skill / Hook / Rule候选 · 回放 · 灰度 · 回滚</text><text x="350" y="54" text-anchor="middle" style="font:700 25px sans-serif;fill:#c2410c">LOOP</text></g>
      <path d="M350 46 L370 46" class="edge-dash"/><path d="M722 46 L742 46" class="edge-dash"/>
    </g>
  </g>

  <path d="M800 881 L800 911" class="edge"/>

  <!-- Layer 5 -->
  <g transform="translate(30 914)">
    <rect width="1540" height="98" rx="20" fill="#0f172a" filter="url(#shadow)"/>
    <text x="28" y="34" class="white" style="font:700 17px 'Microsoft YaHei',sans-serif">生产同构基础设施</text><text x="28" y="54" class="mutedWhite" style="font:600 10px Arial,sans-serif;letter-spacing:1.4px">PERSISTENCE · ASYNC JOBS · OBSERVABILITY · DEPLOYMENT</text>
    <g transform="translate(288 20)">
      <g><rect width="190" height="58" rx="13" fill="#1e293b" stroke="#475569"/><text x="95" y="25" text-anchor="middle" class="white" style="font:700 14px sans-serif">MongoDB</text><text x="95" y="44" text-anchor="middle" class="mutedWhite" style="font:400 10px sans-serif">文档 · 工单 · Trace · 策略</text></g>
      <g transform="translate(208 0)"><rect width="190" height="58" rx="13" fill="#1e293b" stroke="#475569"/><text x="95" y="25" text-anchor="middle" class="white" style="font:700 14px sans-serif">Redis Stream</text><text x="95" y="44" text-anchor="middle" class="mutedWhite" style="font:400 10px sans-serif">队列 · 重试 · 死信 · 心跳</text></g>
      <g transform="translate(416 0)"><rect width="190" height="58" rx="13" fill="#1e293b" stroke="#475569"/><text x="95" y="25" text-anchor="middle" class="white" style="font:700 14px sans-serif">Worker</text><text x="95" y="44" text-anchor="middle" class="mutedWhite" style="font:400 10px sans-serif">入库 · 向量化 · Loop作业</text></g>
      <g transform="translate(624 0)"><rect width="220" height="58" rx="13" fill="#1e293b" stroke="#475569"/><text x="110" y="25" text-anchor="middle" class="white" style="font:700 14px sans-serif">Prometheus / Health</text><text x="110" y="44" text-anchor="middle" class="mutedWhite" style="font:400 10px sans-serif">指标 · /healthz · /readyz</text></g>
      <g transform="translate(862 0)"><rect width="250" height="58" rx="13" fill="#1e293b" stroke="#475569"/><text x="125" y="25" text-anchor="middle" class="white" style="font:700 14px sans-serif">Docker · Kubernetes · Helm</text><text x="125" y="44" text-anchor="middle" class="mutedWhite" style="font:400 10px sans-serif">容器编排 · HPA · 灰度交付</text></g>
    </g>
  </g>
</svg>
