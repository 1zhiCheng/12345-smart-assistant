# 部门 Agent 模板化示例（城市管理局）。
# 每部门独立 Deployment + HPA，按 QPS 自动伸缩（热门部门 maxReplicas 可到 20）。
apiVersion: v1
kind: Service
metadata:
  name: dept-agent-city-management
  namespace: wuhu-12345
spec:
  selector:
    app: dept-agent
    department: city-management
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dept-agent-city-management
  namespace: wuhu-12345
  labels:
    app: dept-agent
    department: city-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dept-agent
      department: city-management
  template:
    metadata:
      labels:
        app: dept-agent
        department: city-management
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: department
                      operator: In
                      values: ["city-management"]
                topologyKey: kubernetes.io/hostname
      containers:
        - name: agent
          image: wuhu-12345-agent:v1.0
          ports:
            - containerPort: 8000
          env:
            - name: DEPT_ID
              value: "dept_city_management"
            - name: MODEL_NAME
              value: "deepseek-v4-flash"
            - name: STORAGE_MODE
              value: "mongo"
            - name: VECTOR_BACKEND
              value: "mongo"
            - name: DEPT_AGENTS_ENABLED
              value: "false"
            - name: PI_AGENT_ENABLED
              value: "false"
            - name: EMBEDDING_PROVIDER
              value: "local"
            - name: EMBEDDING_MODEL
              value: "BAAI/bge-small-zh-v1.5"
            - name: EMBEDDING_DIM
              value: "512"
            - name: SEED_DEMO_USERS
              value: "false"
            - name: SEED_OPERATIONAL_DEMO_DATA
              value: "false"
            - name: PI_AGENT_URL
              value: "http://pi-agent:8100"
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wuhu-12345-secrets
                  key: DEEPSEEK_API_KEY
            - name: RELAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wuhu-12345-secrets
                  key: RELAY_API_KEY
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: wuhu-12345-secrets
                  key: MONGODB_URI
            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: wuhu-12345-secrets
                  key: REDIS_ADDR
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: wuhu-12345-secrets
                  key: INTERNAL_API_TOKEN
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dept-agent-city-management-hpa
  namespace: wuhu-12345
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dept-agent-city-management
  minReplicas: 2
  maxReplicas: 20   # 城市管理类热线高峰可扩容到 20 个 Pod
  metrics:
    - type: Pods
      pods:
        metric:
          name: wuhu12345_dept_agent_inflight
        target:
          type: AverageValue
          averageValue: "8"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 3
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
