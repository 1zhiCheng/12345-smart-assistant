# Loop Engine 独立后台服务：周期性消费反馈执行进化循环
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loop-engine
  namespace: wuhu-12345
  labels:
    app: loop-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loop-engine
  template:
    metadata:
      labels:
        app: loop-engine
    spec:
      containers:
        - name: loop-engine
          image: wuhu-12345-agent:v1.0
          command: ["python", "-m", "scripts.async_worker"]
          env:
            - name: UPLOAD_STORAGE_DIR
              value: "/data/uploads"
            - name: STORAGE_MODE
              value: "mongo"
            - name: EMBEDDING_PROVIDER
              value: "local"
            - name: EMBEDDING_MODEL
              value: "BAAI/bge-small-zh-v1.5"
            - name: EMBEDDING_DIM
              value: "512"
            - name: VECTOR_BACKEND
              value: "mongo"
            - name: LOOP_PHASE
              value: "human_on_loop"
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wuhu-12345-secrets
                  key: DEEPSEEK_API_KEY
            - name: RELAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wuhu-12345-secrets
                  key: RELAY_API_KEY
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: wuhu-12345-secrets
                  key: MONGODB_URI
            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: wuhu-12345-secrets
                  key: REDIS_ADDR
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: wuhu-12345-uploads
