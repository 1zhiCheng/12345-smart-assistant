<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>12345 录音标注工作台</title>
  <style>
    :root{--red:#b91c1c;--ink:#172033;--muted:#64748b;--line:#d9dee7;--bg:#f7f4ef;--teal:#0f766e}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:var(--bg)}header{display:flex;align-items:center;gap:20px;padding:18px 26px;color:#fff;background:var(--ink)}header h1{margin:0;font-size:24px}header p{margin:0;color:#cbd5e1;font-size:14px}button,.file-button,select,input,textarea{font:inherit}button,.file-button{border:0;border-radius:7px;padding:9px 15px;cursor:pointer;font-weight:700}button.primary,.file-button{color:#fff;background:var(--red)}button.secondary{color:var(--ink);background:#fff;border:1px solid var(--line)}button.danger{color:var(--red);background:#fee2e2}.file-button input{display:none}.toolbar{margin-left:auto;display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.privacy{padding:10px 26px;color:#92400e;background:#fef3c7;font-size:14px}.purpose{padding:12px 26px;color:#334155;background:#e8eef8;border-bottom:1px solid #cbd5e1;font-size:14px;line-height:1.7}.purpose strong{color:var(--ink)}main{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:calc(100vh - 148px)}aside{border-right:1px solid var(--line);background:#fff;overflow:auto}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:14px;border-bottom:1px solid var(--line)}.metric{text-align:center;padding:9px 3px;background:#f1f5f9;border-radius:6px;font-size:12px}.metric strong{display:block;color:var(--red);font-size:20px}.case-list{padding:7px}.case-item{width:100%;text-align:left;padding:10px 12px;margin:3px 0;border:1px solid transparent;background:#fff;color:var(--ink);font-weight:400}.case-item.active{border-color:var(--red);background:#fff7f7}.case-item.risk{border-left:4px solid #f59e0b}.case-item small{display:block;margin-top:4px;color:var(--muted)}.case-item .risk-text{color:#b45309}.status{float:right;font-size:12px;color:var(--muted)}section.editor{padding:22px 28px 60px;overflow:auto}.empty{padding:80px;color:var(--muted);text-align:center}.heading{display:flex;align-items:flex-end;gap:18px;margin-bottom:18px}.heading h2{margin:0;font-size:28px}.heading span{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}.full{grid-column:1/-1}label.field{display:block}label.field>span{display:block;margin-bottom:6px;font-weight:700;font-size:14px}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:7px;padding:9px 10px;background:#fff;color:var(--ink)}textarea{min-height:95px;resize:vertical;line-height:1.55}#transcript{min-height:220px}.panel{margin-top:18px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:9px}.panel h3{margin:0 0 12px;font-size:18px}.machine-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 18px;margin-top:10px;font-size:14px}.machine-grid span{color:#92400e}.audio-tools{display:flex;align-items:center;gap:10px;margin-top:8px}.audio-tools select{width:auto;padding:5px 8px}audio{width:100%}.audio-status{margin:8px 0 0;color:var(--muted);font-size:14px}.audio-status.ok{color:var(--teal)}.audio-status.error{color:var(--red)}table{width:100%;border-collapse:collapse;font-size:14px}th,td{border:1px solid var(--line);padding:7px;vertical-align:top}th{background:#eef2f7}td input,td select,td textarea{padding:6px;border-radius:4px}td textarea{min-height:58px}td:last-child{white-space:nowrap}.segment-actions,.footer-actions{display:flex;gap:8px;margin-top:10px;align-items:center}.footer-actions{margin-top:20px}.message{margin-left:auto;max-width:55%;color:var(--muted);white-space:pre-wrap}.message.error{color:var(--red)}.message.ok{color:var(--teal)}@media(max-width:900px){header{align-items:flex-start;flex-direction:column}.toolbar{margin-left:0;justify-content:flex-start}main{grid-template-columns:1fr}aside{max-height:240px;border-right:0;border-bottom:1px solid var(--line)}.grid,.machine-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><div><h1>12345 录音标注工作台</h1><p>逐字稿、说话人时间戳与工单语义字段</p></div><div class="toolbar"><label class="file-button">载入标注 JSON<input id="jsonFile" type="file" accept="application/json,.json"></label><label class="file-button">选择录音文件夹<input id="audioFolder" type="file" webkitdirectory directory multiple accept="audio/*"></label><label class="file-button">选择当前音频<input id="audioFile" type="file" accept="audio/*"></label><button class="secondary" id="validateAll">校验全部</button><button class="primary" id="exportJson">导出 JSON</button></div></header>
  <div class="privacy">数据只保留在当前浏览器内存中。真实录音、逐字稿和私有标注不得上传到公开服务或提交到 Git。</div>
  <div class="purpose"><strong>用途：</strong>这是比赛真实录音的人工复核工具，不是坐席业务办理页面。优先载入 Agent 生成的 prefilled 私有 JSON，再选择“信件类别示例工单及录音”文件夹；人工边听边校正机器草稿，批准后导出 JSON 供冻结集评测。</div>
  <main><aside><div class="summary"><div class="metric"><strong id="caseCount">0</strong>全部</div><div class="metric"><strong id="draftCount">0</strong>机器草稿</div><div class="metric"><strong id="readyCount">0</strong>已审</div><div class="metric"><strong id="timedCount">0</strong>有时间戳</div></div><div class="case-list" id="caseList"></div></aside><section class="editor" id="editor"><div class="empty">先载入 Agent 生成的 prefilled 私有 JSON</div></section></main>
  <script>
    let dataset=null,activeIndex=-1,audioFiles=[],audioUrl=null,playbackRate=1;const manualAudioFiles=new Map();const $=id=>document.getElementById(id);const asLines=v=>Array.isArray(v)?v.join("\n"):(v||"");const fromLines=v=>v.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const audioSuffix=/\.(mp3|wav|m4a|flac|aac|ogg|webm|mp4)$/i;const normalizeRef=value=>String(value||"").replace(/\\/g,"/").replace(/^\.\//,"").toLowerCase();
    function findAudio(item){const manual=manualAudioFiles.get(item.id);if(manual)return{file:manual,mode:"当前工单手动选择"};const refs=[item.audio_ref,item.audio_path,item.audio_file,item.audioFile].filter(Boolean).map(normalizeRef);for(const ref of refs){const name=ref.split("/").pop();const file=audioFiles.find(candidate=>{const local=normalizeRef(candidate.webkitRelativePath||candidate.name);return local===ref||local.endsWith("/"+ref)||local.split("/").pop()===name});if(file)return{file,mode:"录音文件夹自动匹配"}}return null}
    function attachAudioForActive(){const player=$("audioPlayer");if(!player||!dataset||activeIndex<0)return;if(audioUrl){URL.revokeObjectURL(audioUrl);audioUrl=null}const item=dataset.cases[activeIndex],match=findAudio(item),status=player.parentElement.querySelector("p");player.removeAttribute("src");player.load();player.playbackRate=playbackRate;status.className="audio-status";if(match){audioUrl=URL.createObjectURL(match.file);player.src=audioUrl;player.load();player.playbackRate=playbackRate;status.textContent=`已匹配：${match.file.name}（${match.mode}）`;status.classList.add("ok");return}const ref=item.audio_ref||item.audio_path||item.audio_file||item.audioFile;if(audioFiles.length&&!ref){status.textContent="当前 JSON 没有 audio_ref，无法从文件夹自动定位。请重新载入更新后的私有模板，或用顶部“选择当前音频”。";status.classList.add("error")}else if(audioFiles.length){status.textContent=`未在所选文件夹找到：${ref}。可重新选择完整数据集文件夹，或手动选择当前音频。`;status.classList.add("error")}else{status.textContent="请先选择完整录音文件夹；也可以只为本条记录选择当前音频。音频始终只在本机读取。"}}
    function saveCurrent(){if(!dataset||activeIndex<0||!$("caseId"))return;const item=dataset.cases[activeIndex];item.received_at=$("receivedAt").value.trim()||null;item.reference.transcript=$("transcript").value.trim();for(const key of["time","location","event","request"])item.reference.fields[key]=fromLines($("field_"+key).value);item.reference.category=$("category").value.trim();item.reference.region=$("region").value.trim();item.reference.department_ids=fromLines($("departmentIds").value);item.reference.department_names=fromLines($("departmentNames").value);item.review.status=$("reviewStatus").value;item.review.annotator=$("annotator").value.trim();item.review.reviewed_at=$("reviewedAt").value.trim()||null;item.review.notes=$("notes").value.trim();item.reference.segments=[...document.querySelectorAll("#segments tbody tr")].map(row=>({start:row.querySelector(".start").value===""?null:Number(row.querySelector(".start").value),end:row.querySelector(".end").value===""?null:Number(row.querySelector(".end").value),speaker:row.querySelector(".speaker").value,text:row.querySelector(".segment-text").value.trim()}))}
    function validation(item){const errors=[],warnings=[];if(!["pending","machine_draft","seeded","approved","rejected"].includes(item.review?.status))errors.push("审核状态非法");if(["seeded","approved"].includes(item.review?.status)){if(!item.reference?.transcript?.trim())errors.push("缺少参考逐字稿");for(const key of["location","event","request"])if(!item.reference?.fields?.[key]?.length)errors.push(`缺少字段 ${key}`)}let previousEnd=0,allTimed=item.reference?.segments?.length>0;for(const[index,seg]of(item.reference?.segments||[]).entries()){if(!seg.text?.trim())errors.push(`第 ${index+1} 段没有文本`);if((seg.start==null)!==(seg.end==null))errors.push(`第 ${index+1} 段必须同时填写起止时间`);if(seg.start==null)allTimed=false;else if(seg.start<previousEnd||seg.end<=seg.start)errors.push(`第 ${index+1} 段时间戳乱序或非法`);else previousEnd=seg.end}const officialApproval=item.review?.status==="approved"&&item.frozen&&item.source_kind==="official_real_audio";if(officialApproval){const roles=new Set((item.reference?.segments||[]).map(seg=>seg.speaker));if(!item.reference?.segments?.length)errors.push("真实录音批准前必须填写说话人时间片");if(!allTimed)errors.push("真实录音批准前必须补齐全部时间戳");if(roles.has("unknown"))errors.push("真实录音批准前必须消除 unknown 角色");if(!roles.has("operator")||!roles.has("citizen"))errors.push("真实录音批准前必须同时标出接线员和群众") }else if(item.reference?.segments?.length&&!allTimed)warnings.push("角色已标注，但 DER 需要每段起止时间");if(item.review?.status==="machine_draft")warnings.push("这是机器草稿，必须人工核对后批准");return{errors,warnings,allTimed}}
    function renderList(){if(!dataset)return;const labels={pending:"待生成",machine_draft:"机器草稿",seeded:"开发标注",approved:"已批准",rejected:"已驳回"};$("caseCount").textContent=dataset.cases.length;$("draftCount").textContent=dataset.cases.filter(x=>x.review?.status==="machine_draft").length;$("readyCount").textContent=dataset.cases.filter(x=>["seeded","approved"].includes(x.review?.status)).length;$("timedCount").textContent=dataset.cases.filter(x=>validation(x).allTimed).length;$("caseList").innerHTML=dataset.cases.map((item,index)=>{const machine=item.machine_prefill||{},risk=item.review?.status==="machine_draft"&&(machine.diarization_mode!=="acoustic"||Number(machine.diarization_confidence||0)<0.3);return`<button class="case-item ${index===activeIndex?'active':''} ${risk?'risk':''}" data-index="${index}"><span class="status">${esc(labels[item.review?.status]||item.review?.status||'待生成')}</span>${esc(item.id)}<small>${esc(item.reference?.category||'未分类')} · ${esc(item.reference?.region||'未标区域')}</small>${risk?'<small class="risk-text">⚠ 角色需重点核对</small>':''}</button>`}).join("");document.querySelectorAll(".case-item").forEach(button=>button.onclick=()=>{saveCurrent();activeIndex=Number(button.dataset.index);render()})}
    function segmentRow(segment={speaker:"unknown",start:null,end:null,text:""}){return`<tr><td><input class="start" type="number" step="0.01" min="0" value="${segment.start??''}"></td><td><input class="end" type="number" step="0.01" min="0" value="${segment.end??''}"></td><td><select class="speaker"><option value="operator" ${segment.speaker==='operator'?'selected':''}>接线员</option><option value="citizen" ${segment.speaker==='citizen'?'selected':''}>群众</option><option value="unknown" ${segment.speaker==='unknown'?'selected':''}>待确认</option></select></td><td><textarea class="segment-text">${esc(segment.text)}</textarea></td><td><button class="secondary play-segment">播放</button> <button class="danger remove-segment">删除</button></td></tr>`}
    function renderEditor(){if(!dataset||activeIndex<0)return;const item=dataset.cases[activeIndex],ref=item.reference||(item.reference={fields:{},segments:[]}),machine=item.machine_prefill||{},suggestion=machine.suggestion||{},suggestedFields=suggestion.fields||{};item.review||={status:"pending",annotator:"",reviewed_at:null,notes:""};ref.fields||={};ref.segments||=[];const confidence=Math.round(Number(machine.diarization_confidence||0)*100),roleRisk=machine.diarization_mode!=="acoustic"||confidence<30;const draftNotice=item.review.status==="machine_draft"?`<div class="panel" style="border-color:${roleRisk?'#dc2626':'#f59e0b'};background:#fffbeb"><strong>机器预标注，尚未成为标准答案。</strong> 请逐项核对录音、角色、时间戳和工单字段；确认无误后填写标注人并点击“批准并下一条”。<div class="machine-grid"><div>ASR：<span>${esc(machine.asr_model||machine.asr_provider||'未知')}</span></div><div>角色分离：<span>${esc(machine.diarization_mode||'未知')} · ${confidence}%${roleRisk?'（重点核对）':''}</span></div><div>工单生成：<span>${esc(machine.generation_mode||'未知')}</span></div><div>路由方式：<span>${esc(machine.routing_matched_by||'未知')}</span></div></div><details style="margin-top:10px"><summary>查看 Agent 建议（仅供对照，不覆盖比赛已有字段）</summary><div class="machine-grid"><div>建议类别：<span>${esc(suggestion.category||'无')}</span></div><div>建议区域：<span>${esc(suggestion.region||'无')}</span></div><div>建议地点：<span>${esc(asLines(suggestedFields.location)||'无')}</span></div><div>建议部门：<span>${esc(asLines(suggestion.department_names)||'无')}</span></div></div></details></div>`:"";$("editor").innerHTML=`<div class="heading"><h2 id="caseId">${esc(item.id)}</h2><span>${esc(item.source_kind)} · ${esc(item.split)} · frozen=${esc(item.frozen)}</span></div>${draftNotice}<div class="panel"><h3>当前音频</h3><audio id="audioPlayer" controls></audio><div class="audio-tools"><label>播放速度 <select id="playbackRate"><option value="0.75">0.75×</option><option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><span style="color:var(--muted)">可点击时间片“播放”从该段开始试听</span></div><p style="color:var(--muted);margin-bottom:0">使用顶部“选择录音文件夹”自动匹配，音频只在本机播放。</p></div><div class="grid panel"><label class="field"><span>受理时间</span><input id="receivedAt" value="${esc(item.received_at||'')}"></label><label class="field"><span>审核状态</span><select id="reviewStatus"><option value="pending">pending</option><option value="machine_draft">machine_draft（机器草稿）</option><option value="seeded">seeded</option><option value="approved" disabled>approved（请用批准按钮）</option><option value="rejected">rejected</option></select></label><label class="field full"><span>脱敏逐字稿</span><textarea id="transcript" placeholder="接线员：……\n群众：……">${esc(ref.transcript||'')}</textarea></label>${["time","location","event","request"].map(key=>`<label class="field"><span>${{time:"时间要点",location:"地点要点",event:"事件要点",request:"群众诉求"}[key]}，每行一项</span><textarea id="field_${key}">${esc(asLines(ref.fields[key]))}</textarea></label>`).join('')}<label class="field"><span>事项类别</span><input id="category" value="${esc(ref.category||'')}"></label><label class="field"><span>区域</span><input id="region" value="${esc(ref.region||'')}"></label><label class="field"><span>部门 ID，每行一项</span><textarea id="departmentIds">${esc(asLines(ref.department_ids))}</textarea></label><label class="field"><span>部门名称，每行一项</span><textarea id="departmentNames">${esc(asLines(ref.department_names))}</textarea></label></div><div class="panel"><h3>说话人时间片</h3><table id="segments"><thead><tr><th>开始秒</th><th>结束秒</th><th>角色</th><th>文本</th><th>操作</th></tr></thead><tbody>${ref.segments.map(segmentRow).join('')}</tbody></table><div class="segment-actions"><button class="secondary" id="addSegment">添加时间片</button><button class="secondary" id="segmentsFromTranscript">按逐字稿生成无时间戳分段</button></div></div><div class="grid panel"><label class="field"><span>标注人</span><input id="annotator" value="${esc(item.review.annotator||'')}"></label><label class="field"><span>审核时间</span><input id="reviewedAt" value="${esc(item.review.reviewed_at||'')}"></label><label class="field full"><span>备注</span><textarea id="notes">${esc(item.review.notes||'')}</textarea></label></div><div class="footer-actions"><button class="primary" id="saveCase">保存当前</button><button class="primary" id="approveCase">批准并下一条</button><button class="secondary" id="validateCase">校验当前</button><button class="secondary" id="prevCase">上一条</button><button class="secondary" id="nextCase">下一条</button><div class="message" id="message"></div></div>`;$("reviewStatus").value=item.review.status||"pending";bindEditor()}
    function bindEditor(){const bindRows=()=>{document.querySelectorAll(".remove-segment").forEach(btn=>btn.onclick=()=>btn.closest("tr").remove());document.querySelectorAll(".play-segment").forEach(btn=>btn.onclick=()=>{const row=btn.closest("tr"),player=$("audioPlayer"),start=Number(row.querySelector(".start").value||0);if(!player.src){show("请先选择录音文件夹或当前音频。","error");return}player.currentTime=start;player.playbackRate=playbackRate;player.play().catch(()=>show("浏览器未允许自动播放，请先点击播放器。","error"))})};bindRows();$("playbackRate").value=String(playbackRate);$("playbackRate").onchange=event=>{playbackRate=Number(event.target.value);$("audioPlayer").playbackRate=playbackRate};$("addSegment").onclick=()=>{$("segments").querySelector("tbody").insertAdjacentHTML("beforeend",segmentRow());bindRows()};$("segmentsFromTranscript").onclick=()=>{const rows=$("transcript").value.split(/\r?\n/).map(line=>line.match(/^(接线员|群众|待确认)\s*[:：]\s*(.+)$/)).filter(Boolean).map(match=>({speaker:{接线员:"operator",群众:"citizen",待确认:"unknown"}[match[1]],start:null,end:null,text:match[2]}));$("segments").querySelector("tbody").innerHTML=rows.map(segmentRow).join("");bindRows()};$("saveCase").onclick=()=>{saveCurrent();renderList();show("已保存到浏览器内存，请导出 JSON 持久化。","ok")};$("approveCase").onclick=()=>{saveCurrent();const item=dataset.cases[activeIndex];if(!item.review.annotator){show("请先填写标注人，再进行人工批准。","error");return}const previousStatus=item.review.status==="approved"?"machine_draft":item.review.status;item.review.status="approved";const result=validation(item);if(result.errors.length){item.review.status=previousStatus;$("reviewStatus").value=previousStatus;show("不能批准：\n"+result.errors.join("\n"),"error");return}item.review.reviewed_at=new Date().toISOString();const current=activeIndex;let next=dataset.cases.findIndex((candidate,index)=>index>current&&!["approved","seeded"].includes(candidate.review?.status));if(next<0)next=dataset.cases.findIndex((candidate,index)=>index<current&&!["approved","seeded"].includes(candidate.review?.status));activeIndex=next>=0?next:current;render();show(next>=0?"上一条已批准，已进入下一条待审记录。":"全部记录已完成人工批准，请导出 JSON。","ok")};$("validateCase").onclick=()=>{saveCurrent();const result=validation(dataset.cases[activeIndex]);show(result.errors.length?result.errors.join("\n"):(result.warnings.join("\n")||"当前样例通过校验"),result.errors.length?"error":"ok")};$("prevCase").onclick=()=>move(-1);$("nextCase").onclick=()=>move(1)}
    function show(text,kind=""){const node=$("message");if(node){node.textContent=text;node.className="message "+kind}}function move(delta){saveCurrent();activeIndex=Math.max(0,Math.min(dataset.cases.length-1,activeIndex+delta));render()}function render(){renderList();renderEditor();attachAudioForActive()}
    $("jsonFile").onchange=async event=>{const file=event.target.files[0];if(!file)return;dataset=JSON.parse(await file.text());if(!Array.isArray(dataset.cases))throw new Error("JSON 缺少 cases 数组");activeIndex=0;manualAudioFiles.clear();render()};$("audioFolder").onchange=event=>{audioFiles=[...event.target.files].filter(file=>file.type.startsWith("audio/")||audioSuffix.test(file.name));if(dataset)render();if(!audioFiles.length)alert("所选文件夹中没有找到支持的音频文件。")};$("audioFile").onchange=event=>{const file=event.target.files[0];if(file&&dataset&&activeIndex>=0){manualAudioFiles.set(dataset.cases[activeIndex].id,file);attachAudioForActive()}};$("validateAll").onclick=()=>{if(!dataset)return;saveCurrent();const results=dataset.cases.map(item=>validation(item)),errors=results.flatMap((r,i)=>r.errors.map(e=>`${dataset.cases[i].id}: ${e}`)),warnings=results.flatMap((r,i)=>r.warnings.map(e=>`${dataset.cases[i].id}: ${e}`));alert(errors.length?`校验失败 ${errors.length} 项\n${errors.slice(0,20).join('\n')}`:`校验通过。警告 ${warnings.length} 项\n${warnings.slice(0,20).join('\n')}`);renderList()};$("exportJson").onclick=()=>{if(!dataset)return;saveCurrent();const blob=new Blob([JSON.stringify(dataset,null,2)],{type:"application/json"}),link=document.createElement("a");link.href=URL.createObjectURL(blob);link.download=`${dataset.metadata?.dataset_id||'audio-annotations'}.json`;link.click();URL.revokeObjectURL(link.href)};
  </script>
</body>
</html>
